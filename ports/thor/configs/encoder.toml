# Five-stream encoder. Paths are relative to the runtime workspace.
execution = "contexts"
log_prefix = "logs/encoder"

[encoder]
manifest = "models/manifest_thor.json"
frame_num = -1
qp = 11
gop = 96
reset_interval = 32
ltr_start_idx = 0
ltr_period = 0
ltr_qp_shift = 0
translation_warp = true
motion_backend = "nvenc"
motion_prefetch_frames = 1
motion_skip_loop_filter = true
fps = 12
target_fps = 12
input_device_resident = true
video_decode_backend = "nvdec"
motion_decode_threads = 4
device = 0
output_transport_mode = "rtp"
output_transport_host = "192.168.5.17"
output_transport_payload_type = 96
output_transport_pacing_rate_bps = 2000000
output_transport_max_burst_bytes = 1240
# UI statistics receiver on the Windows computer.
ui_stats_host = "192.168.5.3"

[encoder.pipeline]
stream_workers = 1
queue_capacity = 3
frame_buffer_slots = 3
entropy_workers = 1
graph_packet_capacity = 2

# Channel 1
[[streams]]
[streams.encoder]
input_rtsp = "rtsp://192.168.5.3:8554/input0"
output_transport_port = 39480
ui_stats_port = 39600

# Channel 2
[[streams]]
[streams.encoder]
input_rtsp = "rtsp://192.168.5.3:8554/input1"
output_transport_port = 39482
ui_stats_port = 39601

# Channel 3
[[streams]]
[streams.encoder]
input_rtsp = "rtsp://192.168.5.3:8554/input2"
output_transport_port = 39484
ui_stats_port = 39602

# Channel 4
[[streams]]
[streams.encoder]
input_rtsp = "rtsp://192.168.5.3:8554/input3"
output_transport_port = 39486
ui_stats_port = 39603

# Channel 5
[[streams]]
[streams.encoder]
input_rtsp = "rtsp://192.168.5.3:8554/input4"
output_transport_port = 39488
ui_stats_port = 39604
