<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>视频监控</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <h1>视频监控</h1>
      <time id="clock"></time>
      <div class="toolbar">
        <button class="button" id="pause-button">
          <span id="pause-icon">Ⅱ</span
          ><span id="pause-label">暂停预览</span></button
        ><button class="button" id="reconnect-button">
          <svg viewBox="0 0 24 24">
            <path
              d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"
            /></svg
          >重新连接</button
        ><button class="button primary" data-settings>
          <svg viewBox="0 0 24 24">
            <path d="M5 6h14M5 12h14M5 18h14" />
            <circle cx="9" cy="6" r="2" />
            <circle cx="15" cy="12" r="2" />
            <circle cx="10" cy="18" r="2" /></svg
          >参数设置
        </button>
      </div>
    </header>
    <main>
      <div class="view-bar">
        <button class="channel-link active" id="overview">全部</button>
        <nav id="channel-nav" aria-label="视频通道"></nav>
        <div class="filters" aria-label="筛选通道">
          <button class="filter active" data-filter="all">全部通道</button
          ><button class="filter" data-filter="live">
            播放中 <span id="live-count">0</span>
          </button>
        </div>
      </div>
      <section
        class="channel-grid"
        id="channel-grid"
        aria-label="视频通道"
      ></section>
      <div class="empty-filter" id="empty-filter" hidden>暂无播放通道</div>
      <footer id="bandwidth-summary" class="total-bandwidth">
        <span>五路带宽</span><strong id="bandwidth-total">—</strong
        ><span>kB/s</span>
      </footer>
    </main>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <form id="settings-form">
        <header class="drawer-heading">
          <div>
            <h2 id="settings-title">视频源与播放</h2>
          </div>
          <button
            type="button"
            class="icon-button"
            id="close-settings"
            aria-label="关闭"
          >
            ×
          </button>
        </header>
        <fieldset>
          <legend>播放服务</legend>
          <label
            >WebRTC 地址<input
              name="webrtc"
              id="webrtc"
              type="url"
              required /></label
          ><label
            >MediaMTX API 地址<input
              name="media_api"
              id="media_api"
              type="url"
              required /></label
          ><label
            >原图显示补偿 <span class="field-unit">ms</span
            ><input
              name="original_delay_ms"
              id="original_delay_ms"
              type="number"
              min="0"
              max="2000"
              required
          /></label>
        </fieldset>
        <fieldset>
          <legend>视频通道</legend>
          <div class="settings-tabs" id="settings-tabs"></div>
          <div id="channel-fields"></div>
        </fieldset>
        <div class="form-error" id="settings-error" role="alert" hidden></div>
        <footer class="drawer-actions">
          <button type="button" class="button" id="cancel-settings">取消</button
          ><button type="submit" class="button primary" id="save-settings">
            保存并连接
          </button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
